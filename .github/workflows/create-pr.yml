name: Create PR (GitHub Actions bot)

on:
  workflow_dispatch:
    inputs:
      base_repo:
        description: 'Target owner/repo; empty = this repository (bot mode requires this repo)'
        type: string
        required: false
      base_branch:
        description: Target branch
        type: string
        default: main
        required: true
      head_repo:
        description: 'Source owner/repo; empty = this repository'
        type: string
        required: false
      head_branch:
        description: 'Source branch; empty = branch selected in Use workflow from'
        type: string
        required: false
      title:
        description: 'PR title; empty = first commit unique to source branch'
        type: string
        required: false
      body:
        description: PR description (optional)
        type: string
        required: false
      draft:
        description: Create a draft PR
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: create-pr-${{ inputs.base_repo || github.repository }}-${{ inputs.base_branch }}-${{ inputs.head_repo || github.repository }}-${{ inputs.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout: never execute code from the source branch/fork.
      - name: Validate branches and create PR
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          CURRENT_REPO: ${{ github.repository }}
          WORKFLOW_BRANCH: ${{ github.ref_name }}
          BASE_REPO: ${{ inputs.base_repo }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          HEAD_REPO: ${{ inputs.head_repo }}
          HEAD_BRANCH: ${{ inputs.head_branch }}
          PR_TITLE: ${{ inputs.title }}
          PR_BODY: ${{ inputs.body }}
          PR_DRAFT: ${{ inputs.draft }}
          AUTH_MODE: bot
        with:
          github-token: ${{ github.token }}
          script: |
            const env = process.env;
            const current = env.CURRENT_REPO;
            const baseRepo = env.BASE_REPO.trim() || current;
            const headRepo = env.HEAD_REPO.trim() || current;
            const baseBranch = env.BASE_BRANCH.trim() || 'main';
            const headBranch = env.HEAD_BRANCH.trim() || env.WORKFLOW_BRANCH;
            function parseRepo(value) {
              if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(value)) {
                throw new Error(`Invalid owner/repo: ${value}`);
              }
              const [owner, repo] = value.split('/');
              return { owner, repo };
            }
            const base = parseRepo(baseRepo);
            const head = parseRepo(headRepo);
            if (env.AUTH_MODE === 'bot' && baseRepo.toLowerCase() !== current.toLowerCase()) {
              throw new Error('GITHUB_TOKEN can only create PRs in this repository. Run the workflow in the target repo, or use Create PR (PAT).');
            }
            const { data: target } = await github.rest.repos.get(base);
            const { data: source } = await github.rest.repos.get(head);
            if ((target.source?.id ?? target.id) !== (source.source?.id ?? source.id)) {
              throw new Error('Source and target must belong to the same fork network.');
            }
            const sameRepo = target.id === source.id;
            if (sameRepo && baseBranch === headBranch) {
              throw new Error('Source and target branches must differ.');
            }
            const { data: baseRef } = await github.rest.repos.getBranch({ ...base, branch: baseBranch });
            const { data: headRef } = await github.rest.repos.getBranch({ ...head, branch: headBranch });
            const headLabel = `${source.owner.login}:${headBranch}`;
            const existing = await github.paginate(github.rest.pulls.list, {
              ...base, state: 'open', base: baseBranch, head: headLabel, per_page: 100
            });
            const found = existing.find(pr => pr.head.repo?.id === source.id);
            let pr = found;
            if (!pr) {
              // Immutable SHAs prevent the title calculation from moving with branch updates.
              // Explicit pagination returns the earliest commits first, including >250 commits.
              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                ...base,
                basehead: `${baseRef.commit.sha}...${headRef.commit.sha}`,
                per_page: 100,
                page: 1
              });
              if (!comparison.total_commits || !comparison.commits.length) {
                throw new Error('No commits in the source branch that are absent from the target.');
              }
              const title = env.PR_TITLE.trim() || comparison.commits[0].commit.message.split(/\r?\n/)[0].trim();
              if (!title) throw new Error('The first commit has no subject; provide a PR title.');
              const payload = {
                ...base, base: baseBranch,
                head: sameRepo ? headBranch : headLabel,
                title, body: env.PR_BODY || '', draft: env.PR_DRAFT === 'true'
              };
              // Required for cross-repo PRs when both repos belong to the same organization.
              if (!sameRepo) payload.head_repo = source.name;
              try {
                ({ data: pr } = await github.rest.pulls.create(payload));
              } catch (error) {
                if (error.status === 403) {
                  core.error('Check Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests, and any organization policy.');
                }
                throw error;
              }
            }
            core.info(`${found ? 'Existing' : 'Created'} PR: ${pr.html_url}`);
            await core.summary
              .addHeading(found ? 'PR already exists' : 'PR created')
              .addLink(`PR #${pr.number}`, pr.html_url)
              .write();
